name: Kalshi Trading Bot

on:
  # Run every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading bot
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
          KALSHI_BASE_URL: ${{ secrets.KALSHI_BASE_URL }}
          KALSHI_MAX_EXPOSURE: ${{ secrets.KALSHI_MAX_EXPOSURE }}
          KALSHI_STRATEGY: ${{ secrets.KALSHI_STRATEGY }}
          KALSHI_TICKERS: ${{ secrets.KALSHI_TICKERS }}
          KALSHI_DISCORD_WEBHOOK_URL: ${{ secrets.KALSHI_DISCORD_WEBHOOK_URL }}
          KALSHI_SUPABASE_URL: ${{ secrets.KALSHI_SUPABASE_URL }}
          KALSHI_SUPABASE_KEY: ${{ secrets.KALSHI_SUPABASE_KEY }}
        run: |
          python main.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: |
            logs/
            *.log
          retention-days: 7
